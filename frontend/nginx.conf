server {
    listen 80;
    server_name _;

    # Корневая директория со статикой Vite-сборки
    root /usr/share/nginx/html;
    index index.html;

    # Ограничение размера загружаемых файлов (аватары)
    client_max_body_size 10m;

    # Безопасные дефолтные заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Прокси на backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # Аватары через nginx с MinIO
    location /s3/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Кэшируем статику с хешем в имени надолго
    location ~* \.(?:css|js|woff2?|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # SPA-фолбэк: всё остальное -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
