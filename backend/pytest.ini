[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: быстрые модульные тесты (без БД и сети)
    integration: интеграционные тесты с БД и FastAPI TestClient
    slow: длительные тесты, по умолчанию могут быть исключены
addopts = -ra -q --strict-markers --tb=short
